name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK location
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/.android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "Using Android SDK at $SDK_ROOT"

      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :core:test :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: cinepilot-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
